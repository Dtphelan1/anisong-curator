# Tests, type check and build on pull requests and on pushes to other branches.
# (Pushes to main are checked by the Pages deploy workflow.)
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npx vitest run
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build
