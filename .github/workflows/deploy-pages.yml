# Build the app and publish it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". The site is served at https://<owner>.github.io/<repo>/
# or, once a custom domain is set in that page, at the domain's root. The
# configure-pages step reports which (`base_path`), and the build uses it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npx vitest run
      - name: Type check
        run: npx tsc --noEmit
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # base_path is "/<repo>" on github.io and "" on a custom domain.
        run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
